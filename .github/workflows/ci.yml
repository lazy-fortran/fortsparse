name: ci

on:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-analysis:
    name: native parallel analysis
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 8
      OPENBLAS_NUM_THREADS: 1
      OMP_DYNAMIC: "FALSE"
      OMP_WAIT_POLICY: passive
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake gfortran \
            ninja-build liblapack-dev libblas-dev libsuitesparse-dev libmetis-dev
      - name: Configure native Release
        run: >-
          cmake -S . -B native -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DFORTSPARSE_BUILD_TESTING=ON -DFORTSPARSE_ENABLE_SUPERLU=OFF
          -DFORTSPARSE_ENABLE_UMFPACK_IPC=OFF -DFORTSPARSE_ENABLE_MUMPS=OFF
      - name: Build affected native gates
        run: >-
          cmake --build native -j2 --target test_fortsparse_slu_factor
          test_fortsparse_slu_z_api test_fortsparse_slu_threads
      - name: Test values and parallel reuse
        run: >-
          ctest --test-dir native -j1 --output-on-failure --no-tests=error
          -R '^test_fortsparse_(slu_factor|slu_z_api|slu_threads_uncapped|slu_threads_repeat)$'
  # Bounded solver gates, including the independent out-of-process UMFPACK
  # round-trip. Build and run only these named tests; never run the full suite.
  cmake:
    name: cmake + ctest ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            gfortran \
            ninja-build \
            libsuperlu-dev \
            libsuitesparse-dev \
            liblapack-dev \
            libblas-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFORTSPARSE_BUILD_TESTING=ON \
            -DFORTSPARSE_USE_SYSTEM_DEPS=ON

      - name: Build focused solver gates
        run: |
          cmake --build build -j 2 --target \
            test_fortsparse_status \
            test_fortsparse_solve_real \
            test_fortsparse_solve_complex \
            test_fortsparse_solve_derivatives \
            test_fortsparse_complex_solve_derivatives \
            test_fortsparse_superlu_symmetric \
            test_fortsparse_errors \
            test_fortsparse_superlu_status \
            test_fortsparse_umfpack_ipc \
            test_fortsparse_umfpack_controls \
            fortsparse_umfpack_helper \
            test_fortsparse_precision \
            test_fortsparse_mixed_lu \
            test_fortsparse_stability \
            test_mixed_allocations \
            test_fortsparse_native_general_api \
            test_fortsparse_slu_z_api \
            test_fortsparse_ldlt_blocked \
            test_fortsparse_native_ldlt \
            test_fortsparse_native_ldlt_z \
            test_fortsparse_inertia

      - name: Test focused solver gates
        run: >-
          ctest --test-dir build -j 2 --output-on-failure --no-tests=error
          -R '^test_fortsparse_(status|solve_real|solve_complex|solve_derivatives|complex_solve_derivatives|superlu_symmetric|errors|superlu_status|umfpack_ipc|umfpack_controls|precision|mixed_lu|stability|native_general_api|slu_z_api|ldlt_blocked|native_ldlt|native_ldlt_z|inertia)$|^test_mixed_allocations$'
