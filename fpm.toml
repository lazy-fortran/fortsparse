name = "fortsparse"
version = "0.1.0"
description = "Unified backend-pluggable sparse direct solver for Fortran"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
license = "MIT"
copyright = "Copyright 2025, lazy-fortran"

[build]
auto-tests = true
# fpm builds the project-owned CPU solvers with system dense BLAS/LAPACK.
# Optional external sparse backends and GPU support use CMake.
link = ["lapack", "blas"]

[library]
source-dir = "src"
include-dir = ["include"]

[fortran]
implicit-typing = false
source-form = "free"

# Preprocess the solver factory and conditional backend tests.
[preprocess]
[preprocess.cpp]

[dependencies]
fortnum = { git = "https://github.com/lazy-fortran/fortnum.git", rev = "65f30ee92d68aad7736c076e748448f2d8644f7f" }
